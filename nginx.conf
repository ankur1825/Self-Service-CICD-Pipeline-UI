server {
    listen 8080;
    server_name _;
    server_tokens off;
    absolute_redirect off;
    port_in_redirect off;

    root /usr/share/nginx/html;
    index index.html;

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    location = / {
        return 302 /pipeline/;
    }

    location = /pipeline {
        return 302 /pipeline/;
    }

    # Local Compose uses this proxy. In EKS the ingress sends the same API path
    # directly to the backend Service.
    location = /pipeline/api {
        proxy_pass http://horizon-cloud-migration-backend:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /pipeline/api/ {
        rewrite ^/pipeline/api/(.*)$ /$1 break;
        proxy_pass http://horizon-cloud-migration-backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /pipeline/static/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        try_files $uri =404;
    }

    location ^~ /pipeline/ {
        try_files $uri $uri/ /pipeline/index.html;
        add_header Cache-Control "no-store" always;
    }
}
