apiVersion: v1
kind: Service
metadata:
  name: {{ include "horizon-self-service-cicd-pipeline-ui-dashboard.fullname" . }}
  namespace: {{ .Values.namespaceOverride }}
  labels:
    {{- include "horizon-self-service-cicd-pipeline-ui-dashboard.labels" . | nindent 4 }}
spec:
