namespaceOverride: horizon-relevance-dev
fullnameOverride: ""

replicaCount: 1

image:
  repository: 426946630837.dkr.ecr.us-east-1.amazonaws.com/horizon/frontend
  tag: "1.4.26"
  pullPolicy: Always

imagePullSecrets: []

service:
  type: ClusterIP
  port: 80
  targetPort: 8080

serviceAccount:
  create: false
  name: ""
  automount: false
  annotations: {}

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 200m
    memory: 128Mi

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 101
  runAsGroup: 101
  fsGroup: 101
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

probes:
  liveness:
    path: /healthz
    initialDelaySeconds: 10
    periodSeconds: 20
  readiness:
    path: /healthz
    initialDelaySeconds: 3
    periodSeconds: 10

ingress:
  enabled: true
  className: nginx
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /$2
    nginx.ingress.kubernetes.io/use-regex: "true"
  hosts:
    - host: horizonrelevance.com
      paths:
        - path: /pipeline(/|$)(.*)
          pathType: ImplementationSpecific
  redirect:
    enabled: true
    annotations:
      nginx.ingress.kubernetes.io/permanent-redirect: http://horizonrelevance.com/pipeline/
    hosts:
      - host: horizonrelevance.com
        paths:
          - path: /pipeline
            pathType: Exact

persistence:
  enabled: true
  storageClass: gp2
  accessMode: ReadWriteOnce
  size: 10Gi

backendAlias:
  enabled: false
  name: horizon-backend
  selector: {}
  port: 8000
  targetPort: 8000
